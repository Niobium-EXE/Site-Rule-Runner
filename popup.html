<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Site Rule Runner</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header>
      <div>
        <h1>Site Rule Runner</h1>
        <div id="currentSite" class="site muted">Current site</div>
      </div>
      <button id="openOptions" class="btn small">Options</button>
    </header>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="css">CSS Hide</button>
      <button class="tab" data-tab="js">JavaScript</button>
    </div>

    <section id="cssTab" class="tab-panel stack">
      <div><label for="cssWebsite">Website</label><input id="cssWebsite" placeholder="example.com or *://*.example.com/*"></div>
      <div><label for="cssSelector">CSS class or selector</label><input id="cssSelector" placeholder="ad-banner or .sidebar .promo"></div>
      <button id="addCss" class="btn primary">Add hide rule</button>
      <div id="cssRules" class="rule-list"></div>
    </section>

    <section id="jsTab" class="tab-panel stack hidden">
      <div><label for="jsWebsite">Website</label><input id="jsWebsite" placeholder="example.com or *://*.example.com/*"></div>
      <div><label for="jsCode">JavaScript</label><textarea id="jsCode" placeholder="// Code to run on matching page loads"></textarea></div>
      <button id="addJs" class="btn primary">Add JavaScript rule</button>
      <div id="jsStatus" class="status"></div>
      <div id="jsRules" class="rule-list"></div>
    </section>

    <footer>
      <button id="importConfig" class="btn small">Import</button>
      <button id="exportConfig" class="btn small">Export</button>
      <input id="fileInput" type="file" accept="application/json,.json" hidden>
    </footer>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
